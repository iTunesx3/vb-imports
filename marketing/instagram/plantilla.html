<!doctype html>
<!-- Publicación de Instagram (1080×1350): solo el logo arriba y la foto de estudio del modelo, sin textos.
     El nombre, el precio y las tallas quedan para la web. La foto ocupa todo lo de abajo de borde a borde:
     si en la foto la zapatilla toca un borde, el corte coincide con la franja del logo o con el borde de la imagen.
     Se abre como plantilla.html?id=<id del producto>; generar.mjs la convierte en imagen. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Publicación VB-Imports</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { background: #FAFAF9; }
  .marco { width: 1080px; height: 1350px; display: flex; flex-direction: column; }
  .cabecera { height: 200px; flex: none; display: grid; place-items: center; }
  .logo { height: 76px; }
  .foto { flex: 1; background: rgb(239, 237, 233); overflow: hidden; }
  .foto img { display: block; width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
<div class="marco">
  <div class="cabecera"><img class="logo" src="../../img/marca/vb-imports-logo.svg" alt=""></div>
  <div class="foto"><img id="foto" alt=""></div>
</div>
<script src="../../js/config.js"></script>
<script src="../../js/productos.js"></script>
<script>
  const id = new URLSearchParams(location.search).get("id");
  const p = window.PRODUCTOS.find((x) => x.id === id) || window.PRODUCTOS[0];
  document.getElementById("foto").src = "../../" + (p.portada || (p.imagenes || [])[0]);
  window.listo = (async () => {
    await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
    return { id: p.id, nombre: p.nombre };
  })();
</script>
</body>
</html>
