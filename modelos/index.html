<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelos del catálogo</title>
<style>
  :root { --bg: #f4f4f5; --barra: #ffffff; --texto: #18181b; --suave: #71717a; --borde: #e4e4e7; --activo: #18181b; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--texto); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, a { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
  .barra { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 16px; background: var(--barra); border-bottom: 1px solid var(--borde); }
  .barra h1 { font-size: 15px; font-weight: 600; margin-right: 8px; }
  .modelos { display: flex; gap: 6px; flex-wrap: wrap; }
  .modelo { display: flex; flex-direction: column; align-items: flex-start; min-height: 44px; padding: 6px 14px; border: 1px solid var(--borde); border-radius: 10px; background: none; cursor: pointer; text-align: left; transition: border-color .15s, background .15s; }
  .modelo:hover { border-color: #a1a1aa; }
  .modelo b { font-weight: 600; }
  .modelo span { font-size: 12px; color: var(--suave); }
  .modelo.on { background: var(--activo); border-color: var(--activo); color: #fff; }
  .modelo.on span { color: #d4d4d8; }
  .derecha { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; }
  .seg button { height: 40px; padding-inline: 14px; border: 0; background: none; cursor: pointer; }
  .seg button.on { background: var(--activo); color: #fff; }
  .abrir { height: 40px; display: inline-flex; align-items: center; padding-inline: 14px; border: 1px solid var(--borde); border-radius: 10px; text-decoration: none; }
  .escenario { flex: 1; display: flex; justify-content: center; padding: 16px; min-height: 0; }
  iframe { width: 100%; height: 100%; border: 1px solid var(--borde); border-radius: 12px; background: #fff; transition: width .25s ease; }
  .movil iframe { width: 390px; max-width: 100%; }
  @media (max-width: 700px) { .derecha { margin-left: 0; } .escenario { padding: 8px; } }
</style>
</head>
<body>
  <div class="barra">
    <h1>Modelos del catálogo</h1>
    <div class="modelos" id="modelos">
      <button class="modelo on" data-src="modelo-a-urbano.html"><b>A · Urbano</b><span>Oscuro, brutalista, streetwear</span></button>
      <button class="modelo" data-src="modelo-b-minimal.html"><b>B · Minimal</b><span>Premium, editorial, limpio</span></button>
      <button class="modelo" data-src="modelo-c-deportivo.html"><b>C · Deportivo</b><span>Color, bloques, energía</span></button>
    </div>
    <div class="derecha">
      <div class="seg" id="vista">
        <button class="on" data-v="escritorio">Escritorio</button>
        <button data-v="movil">Móvil</button>
      </div>
      <a class="abrir" id="abrir" href="modelo-a-urbano.html" target="_blank">Abrir aparte ↗</a>
    </div>
  </div>
  <div class="escenario" id="escenario"><iframe id="marco" src="modelo-a-urbano.html" title="Vista previa del modelo"></iframe></div>
<script>
  const marco = document.getElementById("marco");
  document.getElementById("modelos").addEventListener("click", e => {
    const b = e.target.closest(".modelo"); if (!b) return;
    document.querySelectorAll(".modelo").forEach(x => x.classList.toggle("on", x === b));
    marco.src = b.dataset.src;
    document.getElementById("abrir").href = b.dataset.src;
  });
  document.getElementById("vista").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#vista button").forEach(x => x.classList.toggle("on", x === b));
    document.getElementById("escenario").classList.toggle("movil", b.dataset.v === "movil");
  });
</script>
</body>
</html>
